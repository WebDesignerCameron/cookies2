name: Build and Deploy Nuxt 4 to GitHub Pages
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npx nuxi generate

      - name: Determine deploy folder
        run: |
          if [ -d ".output/public" ]; then echo "DEPLOY_DIR=.output/public" >> $GITHUB_ENV
          elif [ -d "dist" ]; then echo "DEPLOY_DIR=dist" >> $GITHUB_ENV
          else echo "DEPLOY_DIR=." >> $GITHUB_ENV

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.4.0
        with:
          branch: gh-pages
          folder: ${{ env.DEPLOY_DIR }}
          commit-message: "chore: deploy site [skip ci]"
